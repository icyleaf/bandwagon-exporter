[package]
name = "bandwagon-exporter"
version = "0.3.0"
authors = ["icyleaf <icyleaf.cn@gmail.com>"]
description = "A Prometheus Exporter for BandwagonHost KiwiVM."
edition = "2021"

keywords = ["prometheus", "exporter", "bandwagon"]
categories = ["database"]

[dependencies]
clap = { version = "4.5.41", features = ["derive", "env"] }

config = "0.15.13"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

hyper = { version = "1.11.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "http1", "tokio"] }
hyper-rustls = { version = "0.27.9", features = ["http1", "native-tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["full"] }

prometheus = "0.14.0"
lazy_static = "1.5.0"
